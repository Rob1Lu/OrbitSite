// ─── Color utilities ──────────────────────────────────────────────────────────

function parseColor(h) {
  if (h.startsWith('rgb')) { const m = h.match(/\d+/g).map(Number); return [m[0], m[1], m[2]]; }
  const s = h.replace('#', '');
  return [parseInt(s.slice(0,2),16), parseInt(s.slice(2,4),16), parseInt(s.slice(4,6),16)];
}
function mix(a, b, r) {
  const pa = parseColor(a), pb = parseColor(b);
  const m = (i) => Math.round(pa[i]*(1-r)+pb[i]*r);
  return `rgb(${m(0)},${m(1)},${m(2)})`;
}

function PhoneScreen({ app, variant = 'home', w = 220 }) {
  const h = Math.round((w - 12) * 2.168 + 12);
  const bg = app.color;
  const ink = mix(bg, '#1a1410', 0.78);
  const dark = mix(bg, '#1a1410', 0.55);
  const fade = mix(bg, '#fff', 0.4);
  const fadeStrong = mix(bg, '#fff', 0.55);
  const screenshot = app.screenshots && app.screenshots[variant];
  return (
    <div style={{ width: w, height: h, borderRadius: w*0.13, background: '#1a1410', padding: 6, boxShadow: '0 30px 60px -30px rgba(40,30,20,.45), 0 10px 30px -15px rgba(40,30,20,.3)', position: 'relative', flexShrink: 0 }}>

            <img src={screenshot} alt="" style={{ width: '100%', height: '100%', objectFit: 'contain', display: 'block' }} />

        ) : (
          <>
            <div style={{ position: 'absolute', top: 8, left: '50%', transform: 'translateX(-50%)', width: w*0.32, height: 18, background: '#1a1410', borderRadius: 12, zIndex: 3 }} />

function useRoute() {
  const [hash, setHash] = useState(window.location.hash || '#/');
  useEffect(() => {
    const h = () => setHash(window.location.hash || '#/');
    window.addEventListener('hashchange', h);
    return () => window.removeEventListener('hashchange', h);
  }, []);
  return hash;
}

      {/* Metrics */}
      <section style={{ padding: `${py}px ${px}px`, borderBottom: `1px solid ${T.border}` }}>
        <div style={{ display: 'grid', gridTemplateColumns: isMobile ? 'repeat(2, 1fr)' : 'repeat(4, 1fr)', gap: isMobile ? 24 : 48 }}>
          {app.metrics.map(m => (
            <div key={m.l} style={{ paddingTop: isMobile ? 24 : 40, borderTop: `1px solid ${T.border}` }}>
              <div style={{ ...Serif, fontSize: isMobile ? 36 : 52, color: T.accent, fontStyle: 'italic', fontWeight: 300, lineHeight: 1 }}>{m.v}</div>
              <div style={{ fontSize: 13, color: T.inkSoft, marginTop: 12, lineHeight: 1.5 }}>{m.l}</div>
            </div>
          ))}
        </div>
      </section>

      {/* Screens gallery */}
      <section style={{ padding: `${py}px ${px}px`, background: T.paperDeep, borderBottom: `1px solid ${T.border}` }}>
        <Eyebrow>{lang === 'fr' ? 'Écrans' : 'Screens'}</Eyebrow>
        <div style={{ marginTop: isMobile ? 40 : 64, display: 'grid', gridTemplateColumns: isMobile ? '1fr' : 'repeat(3, 1fr)', gap: isMobile ? 40 : 48, justifyItems: 'center' }}>
          {['home', 'detail', 'list'].map((variant, i) => (
            <div key={variant} style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 20 }}>
              <PhoneScreen app={app} variant={variant} w={isMobile ? Math.min(260, window.innerWidth - 80) : 260} />
              <div style={{ fontSize: 11, letterSpacing: 1.6, fontWeight: 600, textTransform: 'uppercase', color: T.inkSoft }}>
                {screenLabels[lang][i]}
              </div>
            </div>
          ))}
        </div>
      </section>

      {/* Testimonials */}
      <section style={{ padding: `${py}px ${px}px`, borderBottom: `1px solid ${T.border}` }}>
        <Eyebrow>{lang === 'fr' ? (app.clientTestimonial ? 'Client & utilisateurs' : 'Utilisateurs') : (app.clientTestimonial ? 'Client & users' : 'Users')}</Eyebrow>
        <div style={{ marginTop: isMobile ? 40 : 64, display: 'flex', flexDirection: 'column', gap: isMobile ? 24 : 40 }}>
          {app.clientTestimonial && (
            <div style={{ padding: isMobile ? '32px 24px' : '56px 64px', background: T.ink, borderRadius: 4, position: 'relative', overflow: 'hidden' }}>
              <div style={{ position: 'absolute', top: -120, right: -120, opacity: 0.12, color: T.accent }}>
                <OrbitGlyph size={480} ringColor="currentColor" dotColor={T.accent} tilt={-18} />
              </div>
              <div style={{ fontSize: 11, letterSpacing: 1.6, fontWeight: 600, textTransform: 'uppercase', color: T.accent, marginBottom: 24 }}>{lang === 'fr' ? 'Témoignage client' : 'Client testimonial'}</div>
              <blockquote style={{ ...Serif, fontSize: isMobile ? 'clamp(18px, 5vw, 28px)' : 'clamp(22px, 2.8vw, 38px)', color: T.paper, margin: 0, lineHeight: 1.3, maxWidth: 840, position: 'relative' }}>
                «&nbsp;{app.clientTestimonial.text[lang]}&nbsp;»
              </blockquote>
              <div style={{ marginTop: isMobile ? 24 : 40, display: 'flex', gap: 14, fontSize: 14, alignItems: 'center', flexWrap: 'wrap' }}>
                <span style={{ fontWeight: 600, color: T.paper }}>{app.clientTestimonial.author}</span>
                <span style={{ color: T.paper, opacity: 0.35 }}>—</span>
                <span style={{ color: T.paper, opacity: 0.6 }}>{app.clientTestimonial.role}</span>
              </div>
            </div>
          )}
          <div style={{ display: 'grid', gridTemplateColumns: isMobile ? '1fr' : `repeat(${app.userTestimonials.length}, 1fr)`, gap: isMobile ? 16 : 28 }}>
            {app.userTestimonials.map((t, i) => (
              <div key={i} style={{ padding: isMobile ? '24px 20px' : '36px 40px', background: T.paperDeep, borderRadius: 4 }}>
                <div style={{ fontSize: 13, color: T.accent, marginBottom: 12, letterSpacing: 1 }}>★★★★★</div>
                <p style={{ fontSize: isMobile ? 15 : 16, lineHeight: 1.7, color: T.ink, margin: 0, fontFamily: '"Fraunces", serif', fontWeight: 400 }}>
                  «&nbsp;{t.text[lang]}&nbsp;»
                </p>
                <div style={{ marginTop: 20, fontSize: 13, color: T.inkSoft }}>
                  <span style={{ fontWeight: 600, color: T.ink }}>{t.author}</span>
                  {' — '}{t.role}
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* Next project */}
      <a href={`#/${nextApp.slug}`} style={{ display: 'block', padding: `${py}px ${px}px`, background: nextApp.color, textDecoration: 'none', borderBottom: `1px solid ${T.border}`, transition: 'opacity .2s' }}
        onMouseEnter={e => e.currentTarget.style.opacity = 0.85}
        onMouseLeave={e => e.currentTarget.style.opacity = 1}
      >
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div>
            <div style={{ fontSize: 11, letterSpacing: 1.6, fontWeight: 600, textTransform: 'uppercase', color: nextApp.accentTone, opacity: 0.45, marginBottom: 16 }}>{lang === 'fr' ? 'Projet suivant' : 'Next project'}</div>
            <div style={{ ...Serif, fontSize: isMobile ? 'clamp(40px, 12vw, 72px)' : 'clamp(48px, 7vw, 112px)', color: nextApp.accentTone, lineHeight: 0.95 }}>{nextApp.name}</div>
            <div style={{ fontSize: 14, color: nextApp.accentTone, opacity: 0.6, marginTop: 12 }}>{nextApp.tag}</div>
          </div>
          <div style={{ fontSize: isMobile ? 36 : 56, color: nextApp.accentTone, opacity: 0.4 }}>→</div>
        </div>
      </a>
    </>
  );
}

function HomePage() {
  return (
    <>
      <HomeHero />
      <HomeManifesto />
      <HomeServices />
      <HomePortfolio />
      <HomeStack />
      <HomeProcess />
      <HomeStats />
      <HomeTestimonials />
      <HomeFAQ />
      <HomeCTA />
    </>
  );
}

// ─── Root ─────────────────────────────────────────────────────────────────────

function App() {
  const [lang, setLang] = useState('fr');
  const route = useRoute();
  const projectApp = OrbitApps.find(a => route === `#/${a.slug}`);
  return (
    <LangCtx.Provider value={{ lang, setLang }}>
      <div style={{ background: T.paper, color: T.ink, minHeight: '100vh', fontFamily: '"Inter", -apple-system, system-ui, sans-serif', letterSpacing: -0.05, lineHeight: 1.5 }}>
        <SiteHeader />
        <main>
          {projectApp ? <ProjectPage app={projectApp} /> : <HomePage />}
        </main>
        <SiteFooter />
      </div>
    </LangCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
